# Render 무료 플랜 슬립(15분 무요청 시 콜드 스타트 50~90초) 방지 및 수동 헬스체크
# 주기적 호출은 GitHub Actions 스케줄러 지연 문제로 외부 Cron 서비스(Cron-job.org 등)에서 워크플로우 API 트리거 또는 직접 호출로 대체
name: Keep backend warm

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint with retry
        run: |
          curl -fsSL \
            --max-time 60 \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "KeepAlive-Warmup/1.0" \
            -o /dev/null \
            -w "HTTP Status: %{http_code} | Time: %{time_total}s\n" \
            https://readwith-be.onrender.com/health
