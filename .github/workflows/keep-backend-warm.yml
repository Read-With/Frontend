# Render 무료 플랜은 15분 무요청 시 슬립(콜드 스타트 50~90초) → 주기적으로 /health 핑
name: Keep backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health endpoint with retry
        run: |
          curl -fsSL \
            --max-time 60 \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "KeepAlive-Warmup/1.0" \
            -o /dev/null \
            -w "HTTP Status: %{http_code} | Time: %{time_total}s\n" \
            https://readwith-be.onrender.com/health
